name: Web

# Marketing site. Vercel already builds + deploys every PR, so CI only adds
# the lint gate Vercel doesn't run. Triggers only on web changes.
on:
  # Manual trigger: on 2026-08-06 pushes stopped producing runs entirely and
  # there was no way to force one.
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths: ["web/**", "persnallyd/src/dashboard.html", ".github/workflows/web.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["web/**", "persnallyd/src/dashboard.html", ".github/workflows/web.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The landing page shows the real dashboard in an iframe. If the copy drifts,
  # the site advertises a product that no longer looks like the one you install.
  preview-sync:
    name: Web — Dashboard preview in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: dashboard-preview.html matches the dashboard it mirrors
        run: |
          if ! diff -q persnallyd/src/dashboard.html web/public/dashboard-preview.html; then
            echo "::error file=web/public/dashboard-preview.html::Drifted from persnallyd/src/dashboard.html. Re-sync with: cp persnallyd/src/dashboard.html web/public/dashboard-preview.html"
            diff persnallyd/src/dashboard.html web/public/dashboard-preview.html | head -40
            exit 1
          fi

  web:
    name: Web — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # Same reasoning as persnallyd's ci.yml: catches a vulnerability landing
      # via a transitive shift with no diff to review.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
