name: Deploy web

# Production deploys of the marketing site, owned by this workflow rather than
# by Vercel's Git integration. The integration promotes whichever branch Vercel
# calls "production" — that was `main`, which trails `dev` (our trunk) by weeks,
# so the live site served a Next version with known vulnerabilities and a
# custody claim we had already corrected on `dev`.
#
# Vercel's integration is still what builds PR previews. This workflow only
# takes over *production*, so set Production Branch to `dev` in the Vercel
# dashboard (or disable auto-promotion) — otherwise a push to `main` and a push
# to `dev` both promote, and the last one to finish wins.
on:
  push:
    branches: [dev]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options: [preview, production]
        default: preview

# Never cancel a running deploy: a half-promoted production alias is worse than
# a queued one.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the deploy credentials are missing
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        # Without this the Vercel CLI fails several minutes in, after a full
        # build, with an error that reads like a build fault rather than a
        # missing secret.
        run: |
          missing=
          [ -n "$TOKEN" ]   || missing="$missing VERCEL_TOKEN"
          [ -n "$ORG" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$PROJECT" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pinned: an unpinned `vercel@latest` silently changes the build contract
      # between two deploys of the same commit.
      - name: Install Vercel CLI
        run: npm install --no-save vercel@58.9.0

      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.target }}" = "production" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull project settings
        run: npx vercel pull --yes --environment=${{ steps.target.outputs.env }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build here, deploy the artifact: the deployed bytes are the ones this
      # run produced, not something rebuilt later on Vercel's side.
      - name: Build
        run: npx vercel build ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        run: |
          # Actions' default shell is `bash -e` without pipefail, so a failing
          # vercel would otherwise be masked by tail's exit code.
          set -o pipefail
          # The CLI writes progress to stdout too; the deployment URL is the last line.
          url=$(npx vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN" | tail -1)
          case "$url" in
            https://*) ;;
            *) echo "::error::Vercel did not return a deployment URL (got: $url)"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # A deploy that returns 200 on the deployment URL but not on the domain
      # has failed in the only way that matters to a visitor.
      - name: Verify the deployment answers
        run: |
          url="${{ steps.deploy.outputs.url }}"
          [ "${{ steps.target.outputs.env }}" = "production" ] && url="https://persnally.com"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$url" || echo 000)
            [ "$code" = "200" ] && echo "$url → 200" && exit 0
            echo "attempt $i: $url → $code"
            sleep 10
          done
          echo "::error::$url never returned 200 after the deploy"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed ${{ steps.target.outputs.env }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
