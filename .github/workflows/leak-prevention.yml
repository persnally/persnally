name: Leak Prevention

# Defense in depth alongside GitHub's native secret scanning + push
# protection (enabled at the repo level): gitleaks gives inline PR feedback
# rather than a separate Security-tab alert, and the second job guards this
# repo's own documented failure mode — internal strategy docs (PIVOT.md,
# launch/) were committed and had to be scrubbed from history in 2026-06.
# They're gitignored now; this catches a future `git add -f` before it ships.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the PR diff — cheap at this repo's size

      # gitleaks/gitleaks-action requires a paid-account license for any
      # org-owned repo (persnally/persnally included), even public ones — the
      # underlying CLI is fully open source and needs no license at all, so
      # this installs the pinned release binary directly instead of the
      # wrapper action. Checksum verified against the release's own
      # checksums.txt, not hardcoded, so a corrupted or tampered download
      # fails closed rather than running unverified.
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source "${{ github.workspace }}" --redact -v

  internal-docs-not-tracked:
    name: Internal docs stay untracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PIVOT.md and launch/ must not be committed
        run: |
          tracked=$(git ls-files PIVOT.md launch/ 2>/dev/null)
          if [ -n "$tracked" ]; then
            echo "::error::Internal strategy docs are tracked in git — these were scrubbed from history in 2026-06 and must stay local-only (see .gitignore):"
            echo "$tracked"
            exit 1
          fi
