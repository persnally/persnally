name: persnallyd

# The v2 product. Unconditional on main/dev — this job is a required branch
# check, and a required check tied to a path filter never reports (so never
# unblocks a merge) on any PR that happens not to touch persnallyd/**.
on:
  # Manual trigger: on 2026-08-06 pushes stopped producing runs entirely and
  # there was no way to force one.
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persnallyd:
    name: persnallyd — Lint, Type Check, Build, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: persnallyd

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: persnallyd/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build (tsc strict) + test (incl. MCP protocol e2e)
        run: npm test

      # Catches a moderate+ vulnerability landing via a *transitive* bump with
      # no diff to review — Dependency Review only sees deps a PR adds or
      # changes directly, not ones that shift because a sibling dep's lockfile
      # entry moved. --omit=dev: a vulnerable devDependency never ships to a user.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
